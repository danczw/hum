[package]
name = "hum"
version = "0.0.0-dev"
edition = "2024"
license = "Apache-2.0"

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
